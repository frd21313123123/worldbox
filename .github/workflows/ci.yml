name: WorldBox Multiplayer CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run protocol and Worldfall compatibility tests
        run: dotnet run --project tests/WireTests.csproj --configuration Release
      - name: Run snapshot framing and integrity tests
        run: dotnet run --project tests/SnapshotTests.csproj --configuration Release

      - name: Run WorldBox save/load contract tests (stubbed API)
        run: dotnet run --project tests/GameAdapterContractTests.csproj --configuration Release
      - name: Upload reproducible source tree
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WorldBoxMultiplayer-source-${{ github.sha }}
          path: |
            src/
            tests/
            scripts/
            docs/
            README.md
            BUILD_STATUS.md
          if-no-files-found: error
  game-dll:
    name: Game DLL (requires private reference bundle)
    needs: protocol-tests
    # Never claim a release build when the target game's managed assemblies are missing.
    if: ${{ vars.ENABLE_GAME_BUILD == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Retrieve privately hosted build-only reference assemblies
        shell: pwsh
        env:
          WB_REFS_URL: ${{ secrets.WB_REFS_URL }}
          WB_REFS_SHA256: ${{ secrets.WB_REFS_SHA256 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WB_REFS_URL) -or [string]::IsNullOrWhiteSpace($env:WB_REFS_SHA256)) {
            throw 'Missing WB_REFS_URL or WB_REFS_SHA256 secret. See docs/CI.md.'
          }
          New-Item -ItemType Directory -Force -Path refs | Out-Null
          Invoke-WebRequest -Uri $env:WB_REFS_URL -OutFile refs/input.zip -MaximumRedirection 2
          $hash = (Get-FileHash refs/input.zip -Algorithm SHA256).Hash
          if ($hash -ne $env:WB_REFS_SHA256.Trim()) { throw 'Reference archive SHA256 mismatch'; }
          Expand-Archive -Path refs/input.zip -DestinationPath refs -Force
          Remove-Item refs/input.zip
          $required = @(
            'refs/game/worldbox_Data/Managed/UnityEngine.CoreModule.dll',
            'refs/game/worldbox_Data/Managed/UnityEngine.InputLegacyModule.dll',
            'refs/game/worldbox_Data/Managed/UnityEngine.IMGUIModule.dll',
            'refs/game/BepInEx/core/BepInEx.dll',
            'refs/Steamworks.NET.dll'
          )
          foreach ($file in $required) { if (!(Test-Path $file)) { throw "Reference assembly missing: $file" } }
      - name: Compile DLL
        shell: pwsh
        run: |
          dotnet build src/WorldBoxMultiplayer.csproj -c Release -p:WorldBoxDir="$PWD/refs/game" -p:SteamDll="$PWD/refs/Steamworks.NET.dll" --warnaserror
          if ($LASTEXITCODE -ne 0) { throw 'Game DLL compilation failed' }
          if (!(Test-Path src/bin/Release/net462/WorldBoxMultiplayer.dll)) { throw 'DLL output missing' }
      - name: Publish DLL to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WorldBoxMultiplayer-${{ github.sha }}
          path: src/bin/Release/net462/WorldBoxMultiplayer.dll
          if-no-files-found: error
          retention-days: 30

  public-game-dll:
    name: Compile game DLL against public references (not an in-game test)
    needs: protocol-tests
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Prepare public Unity, BepInEx and Steamworks.NET compilation references
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -Force -ItemType Directory 'refs/game/worldbox_Data/Managed', 'refs/game/BepInEx/core', 'refs/downloads' | Out-Null

          # WorldBox 0.51.2 uses Unity 2022.3.60f1. Only general-purpose public
          # reference libraries are fetched. No WorldBox/Worldfall binaries.
          Invoke-WebRequest 'https://unity.bepinex.dev/libraries/2022.3.60.zip' -OutFile 'refs/downloads/unity.zip'
          Expand-Archive 'refs/downloads/unity.zip' 'refs/downloads/unity' -Force
          $modules = @('UnityEngine.CoreModule.dll','UnityEngine.InputLegacyModule.dll','UnityEngine.IMGUIModule.dll')
          foreach ($module in $modules) {
            $assembly = Get-ChildItem 'refs/downloads/unity' -Filter $module -File -Recurse | Select-Object -First 1
            if ($null -eq $assembly) { throw "Unity reference $module unavailable" }
            Copy-Item $assembly.FullName ('refs/game/worldbox_Data/Managed/' + $module)
          }

          Invoke-WebRequest 'https://github.com/BepInEx/BepInEx/releases/download/v5.4.23.5/BepInEx_win_x64_5.4.23.5.zip' -OutFile 'refs/downloads/bepinex.zip'
          Expand-Archive 'refs/downloads/bepinex.zip' 'refs/downloads/bepinex' -Force
          $bep = Get-ChildItem 'refs/downloads/bepinex' -Filter BepInEx.dll -File -Recurse | Select-Object -First 1
          if ($null -eq $bep) { throw 'BepInEx.dll missing from upstream distribution' }
          Copy-Item $bep.FullName 'refs/game/BepInEx/core/BepInEx.dll'

          Invoke-WebRequest 'https://github.com/rlabrecque/Steamworks.NET/releases/download/2025.164.1/Steamworks.NET-Standalone_2025.164.1.zip' -OutFile 'refs/downloads/steamworks.zip'
          Expand-Archive 'refs/downloads/steamworks.zip' 'refs/downloads/steamworks' -Force
          $steam = Get-ChildItem 'refs/downloads/steamworks' -Filter Steamworks.NET.dll -File -Recurse | Sort-Object FullName | Select-Object -First 1
          if ($null -eq $steam) { throw 'Steamworks.NET.dll missing from upstream distribution' }
          Copy-Item $steam.FullName 'refs/Steamworks.NET.dll'
          Get-ChildItem 'refs/game/worldbox_Data/Managed','refs/game/BepInEx/core','refs/Steamworks.NET.dll' | Select-Object FullName, Length

      - name: Compile BepInEx mod
        shell: pwsh
        run: |
          dotnet build src/WorldBoxMultiplayer.csproj --configuration Release -p:WorldBoxDir="$PWD/refs/game" -p:SteamDll="$PWD/refs/Steamworks.NET.dll"
          if ($LASTEXITCODE -ne 0) { throw 'Compilation failed: do not publish a fabricated binary' }
          if (!(Test-Path 'src/bin/Release/net462/WorldBoxMultiplayer.dll')) { throw 'Game DLL not produced' }

      - name: Package experimental plugin (never include reference game libraries)
        shell: pwsh
        run: |
          $dir = 'dist/BepInEx/plugins/WorldBoxMultiplayer'
          New-Item -Force -ItemType Directory $dir | Out-Null
          Copy-Item 'src/bin/Release/net462/WorldBoxMultiplayer.dll' "$dir/"
          Copy-Item 'refs/Steamworks.NET.dll' "$dir/"
          @'
          WORLDBOX MULTIPLAYER - EXPERIMENTAL BUILD (NOT A STABLE RELEASE)
          Install BepInEx 5 separately. Copy the BepInEx folder from this archive
          into your WorldBox game directory. Run the game from Steam.
          WARNING: Steam multiplayer, simulation consistency, and Worldfall 3D
          remote characters have NOT been tested and are NOT feature-complete.
          The plugin may fail to load. Back up your worlds before testing.
          '@ | Set-Content 'dist/README-INSTALL.txt'
          Compress-Archive -Path 'dist/BepInEx','dist/README-INSTALL.txt' -DestinationPath 'dist/WorldBoxMultiplayer-experimental-windows.zip' -Force
          Get-FileHash 'dist/WorldBoxMultiplayer-experimental-windows.zip' -Algorithm SHA256 | Format-List
      - name: Upload experimental DLL and installer ZIP
        uses: actions/upload-artifact@v4
        with:
          name: WorldBoxMultiplayer-testbuild-${{ github.sha }}
          path: |
            dist/WorldBoxMultiplayer-experimental-windows.zip
            src/bin/Release/net462/WorldBoxMultiplayer.dll
          if-no-files-found: error
          retention-days: 30
